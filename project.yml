name: SOSMac
options:
  bundleIdPrefix: com.nextlabs
  deploymentTarget:
    macOS: "14.0"

packages:
  CleanCore:
    path: Packages/CleanCore
  TreemapKit:
    path: Packages/TreemapKit

targets:
  SOSMac:
    type: application
    platform: macOS
    sources:
      - path: App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nextlabs.sosmac
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - package: CleanCore
        product: CleanCore
      - package: TreemapKit
        product: TreemapKit
      - target: MenuBarHelper
      - target: PrivilegedHelper
    postbuildScripts:
      - name: Embed Menu Bar Helper
        script: |
          set -e
          DEST="${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}/Library/LoginItems"
          mkdir -p "$DEST"
          rm -rf "$DEST/MenuBarHelper.app"
          cp -R "${BUILT_PRODUCTS_DIR}/MenuBarHelper.app" "$DEST/MenuBarHelper.app"
      - name: Embed Privileged Helper
        script: |
          set -e
          LAUNCHD_DEST="${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}/Library/LaunchDaemons"
          RESOURCES_DEST="${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}/Resources"
          mkdir -p "$LAUNCHD_DEST" "$RESOURCES_DEST"
          cp "${SRCROOT}/PrivilegedHelper/com.nextlabs.sosmac.privilegedhelper.plist" "$LAUNCHD_DEST/"
          cp "${BUILT_PRODUCTS_DIR}/com.nextlabs.sosmac.privilegedhelper" "$RESOURCES_DEST/"

  MenuBarHelper:
    type: application
    platform: macOS
    sources:
      - path: MenuBarHelper
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nextlabs.sosmac.menubarhelper
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - package: CleanCore
        product: CleanCore

  PrivilegedHelper:
    type: tool
    platform: macOS
    sources:
      - path: PrivilegedHelper
        excludes:
          - "*.plist"
    settings:
      base:
        PRODUCT_NAME: com.nextlabs.sosmac.privilegedhelper
        PRODUCT_BUNDLE_IDENTIFIER: com.nextlabs.sosmac.privilegedhelper
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - package: CleanCore
        product: CleanCore
