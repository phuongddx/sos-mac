name: SOSMac
options:
  bundleIdPrefix: com.nextlabs
  deploymentTarget:
    macOS: "14.0"

packages:
  CleanCore:
    path: Packages/CleanCore
  TreemapKit:
    path: Packages/TreemapKit

targets:
  SOSMac:
    type: application
    platform: macOS
    sources:
      - path: App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nextlabs.sosmac
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - package: CleanCore
        product: CleanCore
      - package: TreemapKit
        product: TreemapKit
