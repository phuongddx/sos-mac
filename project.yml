name: SOSMac
options:
  bundleIdPrefix: com.nextlabs
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    # arm64-only, every target and configuration. Homebrew's libyara bottle (linked by
    # CYara in Packages/CleanCore) is arm64-only, so the default ARCHS_STANDARD universal
    # Release build fails to link the x86_64 slice. Intel would need a vendored universal
    # libyara — see docs/superpowers/specs/2026-11-27-release-followups-a-f-design.md (B).
    EXCLUDED_ARCHS: x86_64

packages:
  CleanCore:
    path: Packages/CleanCore
  TreemapKit:
    path: Packages/TreemapKit

targets:
  SOSMac:
    type: application
    platform: macOS
    sources:
      - path: App
    info:
      path: App/Info.plist
      properties:
        # Sparkle feed for the app's own updates (the Updater module reads
        # SUFeedURL from installed apps, including this one). Each release
        # publishes a cumulative appcast.xml as a release asset, so the
        # "latest download" URL always resolves to the newest feed.
        SUFeedURL: https://github.com/phuongddx/sos-mac/releases/latest/download/appcast.xml
        # EdDSA public key matching the login-keychain key
        # "Private key for signing Sparkle updates" (service
        # https://sparkle-project.org); the private half is the
        # SPARKLE_EDDSA_PRIVATE_KEY secret in the `release` environment.
        SUPublicEDKey: qr2BMxaHwjye57wI+y09YjC3u4xJi6cWUnYQzWDcCvM=
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nextlabs.sosmac
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - package: CleanCore
        product: CleanCore
      - package: TreemapKit
        product: TreemapKit
      - target: MenuBarHelper
      - target: PrivilegedHelper
    postbuildScripts:
      - name: Embed Menu Bar Helper
        script: |
          set -e
          DEST="${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}/Library/LoginItems"
          mkdir -p "$DEST"
          rm -rf "$DEST/MenuBarHelper.app"
          # ditto (not cp -R): with SKIP_INSTALL=YES the built product is a
          # relative symlink into UninstalledProducts — ditto copies the real
          # bundle, cp -R would copy the symlink itself and the app would ship
          # a link that only resolves inside the build products directory.
          ditto "${BUILT_PRODUCTS_DIR}/MenuBarHelper.app" "$DEST/MenuBarHelper.app"
      - name: Embed Privileged Helper
        script: |
          set -e
          LAUNCHD_DEST="${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}/Library/LaunchDaemons"
          RESOURCES_DEST="${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}/Resources"
          mkdir -p "$LAUNCHD_DEST" "$RESOURCES_DEST"
          cp "${SRCROOT}/PrivilegedHelper/com.nextlabs.sosmac.privilegedhelper.plist" "$LAUNCHD_DEST/"
          cp "${BUILT_PRODUCTS_DIR}/com.nextlabs.sosmac.privilegedhelper" "$RESOURCES_DEST/"

  MenuBarHelper:
    type: application
    platform: macOS
    sources:
      - path: MenuBarHelper
      - path: App/DesignSystem/Theme.swift
      - path: App/DesignSystem/AuroraSurface.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nextlabs.sosmac.menubarhelper
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        # Embedded into SOSMac.app by the post-build script (never an
        # independently distributed product). Without this the helper also
        # lands in the xcarchive's Products/Applications, turning the archive
        # multi-product — and -exportArchive then rejects every distribution
        # method ("expected one {}").
        SKIP_INSTALL: YES
    dependencies:
      - package: CleanCore
        product: CleanCore

  SOSMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: SOSMacTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nextlabs.sosmac.tests
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SOSMac.app/Contents/MacOS/SOSMac"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: SOSMac

  SOSMacUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: SOSMacUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nextlabs.sosmac.uitests
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - target: SOSMac

  PrivilegedHelper:
    type: tool
    platform: macOS
    sources:
      - path: PrivilegedHelper
        excludes:
          - "*.plist"
    settings:
      base:
        PRODUCT_NAME: com.nextlabs.sosmac.privilegedhelper
        PRODUCT_BUNDLE_IDENTIFIER: com.nextlabs.sosmac.privilegedhelper
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        # Same as MenuBarHelper: shipped inside SOSMac.app/Contents/Resources
        # (the post-build script), never installed standalone — otherwise the
        # tool lands in the xcarchive's Products/usr/local/bin.
        SKIP_INSTALL: YES
    dependencies:
      - package: CleanCore
        product: CleanCore

schemes:
  SOSMac:
    build:
      targets:
        SOSMac: all
        SOSMacTests: [test]
        SOSMacUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SOSMacTests
        - SOSMacUITests
