name: SOSMac
options:
  bundleIdPrefix: com.nextlabs
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    # arm64-only, every target and configuration. Homebrew's libyara bottle (linked by
    # CYara in Packages/CleanCore) is arm64-only, so the default ARCHS_STANDARD universal
    # Release build fails to link the x86_64 slice. Intel would need a vendored universal
    # libyara — see docs/superpowers/specs/2026-11-27-release-followups-a-f-design.md (B).
    EXCLUDED_ARCHS: x86_64

packages:
  CleanCore:
    path: Packages/CleanCore
  TreemapKit:
    path: Packages/TreemapKit

targets:
  SOSMac:
    type: application
    platform: macOS
    sources:
      - path: App
        # The privacy manifest ships with the MAS target only; the Developer
        # ID build stays byte-identical to its current bundle.
        excludes:
          - "Resources/**"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nextlabs.sosmac
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - package: CleanCore
        product: CleanCore
      - package: TreemapKit
        product: TreemapKit
      - target: MenuBarHelper
      - target: PrivilegedHelper
    postbuildScripts:
      - name: Embed Menu Bar Helper
        script: |
          set -e
          DEST="${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}/Library/LoginItems"
          mkdir -p "$DEST"
          rm -rf "$DEST/MenuBarHelper.app"
          cp -R "${BUILT_PRODUCTS_DIR}/MenuBarHelper.app" "$DEST/MenuBarHelper.app"
      - name: Embed Privileged Helper
        script: |
          set -e
          LAUNCHD_DEST="${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}/Library/LaunchDaemons"
          RESOURCES_DEST="${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}/Resources"
          mkdir -p "$LAUNCHD_DEST" "$RESOURCES_DEST"
          cp "${SRCROOT}/PrivilegedHelper/com.nextlabs.sosmac.privilegedhelper.plist" "$LAUNCHD_DEST/"
          cp "${BUILT_PRODUCTS_DIR}/com.nextlabs.sosmac.privilegedhelper" "$RESOURCES_DEST/"

  MenuBarHelper:
    type: application
    platform: macOS
    sources:
      - path: MenuBarHelper
      - path: App/DesignSystem/Theme.swift
      - path: App/DesignSystem/AuroraSurface.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nextlabs.sosmac.menubarhelper
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - package: CleanCore
        product: CleanCore

  # Sandbox twin of the menu bar helper (same sources): launched standalone
  # through NSWorkspace, so it carries its own app-sandbox entitlement rather
  # than the inherit entitlement a directly-spawned child process would use.
  MenuBarHelperMAS:
    type: application
    platform: macOS
    sources:
      - path: MenuBarHelper
      - path: App/DesignSystem/Theme.swift
      - path: App/DesignSystem/AuroraSurface.swift
    settings:
      base:
        PRODUCT_NAME: MenuBarHelperMAS
        PRODUCT_BUNDLE_IDENTIFIER: com.nextlabs.sosmac.menubarhelper
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: App/Support/MenuBarHelperMAS.entitlements
    dependencies:
      - package: CleanCore
        product: CleanCore

  # Mac App Store build of the app: same App/ sources, sandboxed, no
  # PrivilegedHelper and no helper-dependent features (gated with the
  # MAS_BUILD compile condition in the app layer; CleanCore stays identical).
  SOSMacMAS:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - "Resources/**"
      - path: App/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: SOSMacMAS
        PRODUCT_BUNDLE_IDENTIFIER: com.nextlabs.sosmac
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: App/Support/SOSMacMAS.entitlements
      configs:
        debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG MAS_BUILD"
        release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "MAS_BUILD"
    dependencies:
      - package: CleanCore
        product: CleanCore
      - package: TreemapKit
        product: TreemapKit
      - target: MenuBarHelperMAS
    postbuildScripts:
      - name: Embed Menu Bar Helper (MAS)
        script: |
          set -e
          DEST="${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}/Library/LoginItems"
          mkdir -p "$DEST"
          rm -rf "$DEST/MenuBarHelperMAS.app"
          cp -R "${BUILT_PRODUCTS_DIR}/MenuBarHelperMAS.app" "$DEST/MenuBarHelperMAS.app"

  # StoreKit 2 tests run in the MAS app host so the real provider
  # (MAS_BUILD) is what's under test; see StoreKitProTests.swift.
  SOSMacMASTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: SOSMacMASTests
      - path: StoreKit/SOSMacPro.storekit
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nextlabs.sosmac.mastests
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SOSMacMAS.app/Contents/MacOS/SOSMacMAS"
        BUNDLE_LOADER: "$(TEST_HOST)"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG MAS_BUILD"
    dependencies:
      - target: SOSMacMAS

  SOSMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: SOSMacTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nextlabs.sosmac.tests
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SOSMac.app/Contents/MacOS/SOSMac"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: SOSMac

  SOSMacUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: SOSMacUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nextlabs.sosmac.uitests
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - target: SOSMac

  PrivilegedHelper:
    type: tool
    platform: macOS
    sources:
      - path: PrivilegedHelper
        excludes:
          - "*.plist"
    settings:
      base:
        PRODUCT_NAME: com.nextlabs.sosmac.privilegedhelper
        PRODUCT_BUNDLE_IDENTIFIER: com.nextlabs.sosmac.privilegedhelper
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - package: CleanCore
        product: CleanCore

schemes:
  SOSMacMAS:
    build:
      targets:
        SOSMacMAS: all
        SOSMacMASTests: [test]
    run:
      config: Debug
      # Local StoreKit testing (products above) without touching App Store Connect.
      storeKitConfiguration: StoreKit/SOSMacPro.storekit
    test:
      config: Debug
      targets:
        - SOSMacMASTests
  SOSMac:
    build:
      targets:
        SOSMac: all
        SOSMacTests: [test]
        SOSMacUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SOSMacTests
        - SOSMacUITests
