name: CI (bisect)

on:
  pull_request:

jobs:
  build:
    name: Does main build on Xcode 26.4
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.4.1
        run: sudo xcode-select -s /Applications/Xcode_26.4.1.app
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build SOSMac (Dev)
        run: |
          xcodebuild build -jobs 2 \
            -project SOSMac.xcodeproj -scheme SOSMac \
            -configuration Debug -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="" \
            SWIFT_ENABLE_BATCH_MODE=NO COMPILER_INDEX_STORE_ENABLE=NO \
            -quiet
