name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    name: Sign, notarize & publish
    # xcode-27 = GitHub-hosted arm64 runner image with Xcode 27 (public
    # preview). The project is arm64-only (project.yml EXCLUDED_ARCHS).
    runs-on: xcode-27
    # GitHub Environment `release` holds the signing/notarization/Sparkle
    # secrets; create it and the secrets with `gh secret set --env release`
    # (see docs/release.md).
    environment: release
    timeout-minutes: 90
    permissions:
      contents: write          # create the GitHub Release + upload assets
      id-token: write          # actions/attest build provenance
      attestations: write
    steps:
      - name: Check out (full history so CURRENT_PROJECT_VERSION = commit count)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies (xcodegen, yara, openssl@4)
        # openssl@4 is linked statically with yara (Packages/CleanCore/Package.swift):
        # yara 4.6.0's bottle is built against it. Installing it explicitly guards
        # against runner images that ship a stale keg.
        run: brew install xcodegen yara openssl@4

      # Manual temp keychain (same recipe as the app's own CodeEdit-style
      # references): create, unlock, import the Developer ID p12, set the
      # partition list so codesign can use the key non-interactively, then
      # make it the default keychain for the job. Deleted in the `always()`
      # step below.
      - name: Import Developer ID certificate into a temporary keychain
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          CERTFILE="$RUNNER_TEMP/DeveloperIDApplication.p12"
          echo -n "$MACOS_CERTIFICATE" | base64 --decode -o "$CERTFILE"
          security create-keychain -p "$MACOS_CERTIFICATE_PWD" "$KEYCHAIN"
          security unlock-keychain -p "$MACOS_CERTIFICATE_PWD" "$KEYCHAIN"
          security import "$CERTFILE" -k "$KEYCHAIN" -P "$MACOS_CERTIFICATE_PWD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$MACOS_CERTIFICATE_PWD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security default-keychain -s "$KEYCHAIN"

      # Build, sign (Developer ID, hardened runtime, secure timestamp),
      # notarize, staple, DMG + staple DMG, Sparkle appcast. Verifies
      # codesign/spctl on app, menu-bar helper, privileged helper and sweeps
      # every Mach-O in the bundle. Never publishes.
      - name: Build, sign, notarize, staple, package
        env:
          GH_TOKEN: ${{ github.token }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          SPARKLE_EDDSA_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
        run: Scripts/release.sh

      - name: Attest DMG build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: artifacts/release/SOSMac-*.dmg

      - name: Publish GitHub Release (DMG, update zip, appcast)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          gh release create "$TAG" --repo phuongddx/sos-mac \
            --title "SOS Mac ${TAG#v}" --generate-notes \
            artifacts/release/SOSMac-*.dmg \
            artifacts/release/SOSMac-*.zip \
            artifacts/release/appcast/appcast.xml

      - name: Delete temporary keychain
        if: always()
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          if security show-keychain-info "$KEYCHAIN" >/dev/null 2>&1; then
            security default-keychain -s login.keychain-db || true
            security list-keychains -d user -s login.keychain-db || true
            security delete-keychain "$KEYCHAIN" || true
          fi
